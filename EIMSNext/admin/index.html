<!doctype html>
<html lang="en">
  <head>
    <script src="/appSetting.local.js"></script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="简祎沄，东云低代码, 东风低代码 - 功能完整，全面的企业级应用系统，低代码，易扩展，可由业务人员直接配置生成，简单快捷, 支持工作流，数据流，自定义表单，自定义仪表盘，自定义提醒，自定义打印等"
    />
    <meta
      name="keywords"
      content="简祎沄,简祎,祎沄,简,祎,沄,东云,东云低代码,东风,东风低代码,eims,eimsnext,低代码,自定义,应用,管理系统,工作流,数据流,动态表单,提醒,打印,Dongfeng,low-code,custom,workflow,dataflow,reminder,customprint,app,application,management,system,vue,vue3,element-plus,vant,typescript,vite"
    />
    <title>简祎沄 - 演示版</title>
  </head>

  <body>
    <div id="app">
      <div class="boot-screen">
        <img class="boot-logo" src="/src/assets/logo.png" alt="" />
        <div class="boot-name">简祎沄</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
  </body>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // 启动屏跟随已保存的主题（与 settings store 的 useStorage("theme") 一致），避免暗色用户白屏闪烁
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem("theme");
      } catch (e) {}
      var dark =
        theme === "dark" ||
        ((!theme || theme === "auto") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
    })();
  </script>

  <style>
    html,
    body,
    #app {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .boot-screen {
      align-items: center;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .boot-logo {
      animation: boot-breathe 2.4s ease-in-out infinite;
      border-radius: 50%;
      height: 72px;
      width: 72px;
    }

    .boot-name {
      color: rgba(0, 0, 0, 0.82);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 6px;
      text-indent: 6px;
    }

    .boot-bar {
      background: rgba(0, 0, 0, 0.06);
      border-radius: 2px;
      height: 3px;
      overflow: hidden;
      width: 168px;
    }

    .boot-bar span {
      animation: boot-progress 1.6s ease-in-out infinite;
      background: linear-gradient(90deg, #25b09b, #2f7bff);
      border-radius: 2px;
      display: block;
      height: 100%;
      width: 40%;
    }

    html.dark .boot-name {
      color: rgba(255, 255, 255, 0.85);
    }

    html.dark .boot-bar {
      background: rgba(255, 255, 255, 0.08);
    }

    @keyframes boot-breathe {
      0%,
      100% {
        opacity: 0.72;
        transform: scale(0.96);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes boot-progress {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(350%);
      }
    }
  </style>
</html>
