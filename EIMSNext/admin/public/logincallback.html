<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录处理中</title>
    <style>
      body {
        align-items: center;
        background: #f4f7fb;
        color: #1f2a37;
        display: flex;
        font-family: Arial, Helvetica, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      .panel {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        max-width: 360px;
        padding: 32px 28px;
        text-align: center;
      }

      .title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .desc {
        color: #60758a;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="title" id="title">登录处理中</div>
      <div class="desc" id="desc">正在处理第三方登录，请稍候...</div>
    </div>

    <script>
      (function () {
        const script = document.createElement("script");
        script.src = window.location.hostname === "localhost" ? "/appSetting.local.js" : "/appSetting.js";
        script.onload = start;
        script.onerror = start;
        document.head.appendChild(script);

        function setMessage(title, desc) {
          document.getElementById("title").textContent = title;
          document.getElementById("desc").textContent = desc;
        }

        function parseState(state) {
          if (!state) return null;
          try {
            return JSON.parse(decodeURIComponent(atob(state)));
          } catch {
            return null;
          }
        }

        function writeToken(tokenKey, token, expiresIn) {
          localStorage.setItem(tokenKey, token);
          const expiresAt = Date.now() + (Number(expiresIn || 0) - 300) * 1000;
          localStorage.setItem(`${tokenKey}_exp`, String(expiresAt));
        }

        function buildRedirect(redirect) {
          const basePath = window.location.pathname.replace(/\/logincallback\.html$/i, "/");
          const target = redirect && redirect !== "/" ? redirect : "/";
          return `${window.location.origin}${basePath}#${target.startsWith("/") ? target : `/${target}`}`;
        }

        async function start() {
          const appSetting = window.appSetting || {};
          const authUrl = appSetting.authUrl || "https://auth.eimsnext.com";
          const clientId = appSetting.clientId || "EIMSD160507G0401S171201B1014Next";
          const tokenKey = appSetting.tokenKey || "jat";
          const searchParams = new URLSearchParams(window.location.search);
          const code = searchParams.get("code") || searchParams.get("authCode") || "";
          const state = searchParams.get("state") || "";
          const parsedState = parseState(state);
          const type = parsedState && parsedState.type ? parsedState.type : "";
          const redirect = parsedState && parsedState.redirect ? parsedState.redirect : "/";

          if (!type || !code) {
            setMessage("登录失败", "未获取到有效的第三方登录参数。");
            return;
          }

          const payload = new URLSearchParams();
          payload.set("client_id", clientId);
          payload.set("grant_type", "integration");
          payload.set("username", type);
          payload.set("password", `${code}|${state}`);

          try {
            const response = await fetch(`${authUrl}/connect/token`, {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
              },
              body: payload.toString(),
            });

            const data = await response.json();
            if (!response.ok || !data.access_token) {
              throw new Error(data.error_description || data.message || "第三方登录失败");
            }

            writeToken(tokenKey, data.access_token, data.expires_in);
            setMessage("登录成功", "正在跳转到系统...");
            window.location.replace(buildRedirect(redirect));
          } catch (error) {
            setMessage("登录失败", error && error.message ? error.message : "第三方登录失败，请稍后再试。");
          }
        }
      })();
    </script>
  </body>
</html>
